# The scan mapper owns ray clearing and unknown cells. Do not clear them a second time.
/**:
  ros__parameters:
    use_sim_time: false
    resolution: 0.05
    search_time_limit: 0.25
    max_search_expansions: 12000
    obstacle_cost_weight: 1.0
    free_space_clearance: 0.08
    heuristic_weight: 4.0
/wheelchair/local_costmap/local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 10.0
    publish_frequency: 10.0
    rolling_window: true
    width: 10
    height: 10
    resolution: 0.05
    track_unknown_space: true
    always_send_full_costmap: true
    transform_tolerance: 0.15
    footprint: '[[-0.45,-0.30],[0.55,-0.30],[0.55,0.30],[-0.45,0.30]]'
    footprint_padding: 0.0
    plugins:
    - static_layer
    - inflation_layer
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /wheelchair/planning_map
      map_subscribe_transient_local: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.1
      cost_scaling_factor: 3.0
